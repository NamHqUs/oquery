    JoinType: Left
    RefContextId: context-0
  - Alias: Manager2
    Condition: ManagerId = Id
    JoinType: Left
    RefContextId: context-1
Contexts:
  - Id: context-0
    Name: User Context
    Entity: User
    Projection:
      - Id
      - Name
      - Age
  - Id: context-1
    Name: User Context
    Entity: User
    Projection:
      - Id
      - Name
      - Age
