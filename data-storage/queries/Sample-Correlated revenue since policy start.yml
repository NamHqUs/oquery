Entity: Policies
Projection:
  - Id | PolicyId
  - Concat(User.FirstName, < >, User.LastName) | Member
  - Coalesce(RevenueSinceStart.PremiumRevenue, <0>) | RevenueSinceSignup
Sorts: PolicyId ASC
ExtraRelations:
  - Alias: RevenueSinceStart
    Condition: Id = RevenueSinceStart.PolicyId
    JoinType: Left
    RefContextId: context-0
Contexts:
  - Id: context-0
    Name: RevenueSinceStart
    Entity: PremiumPayments
    Projection:
      - PolicyId | PolicyId
      - SUM(Amount) | PremiumRevenue
    Filter: Status = <Paid> AND PaymentDate >= Policy.StartDate
