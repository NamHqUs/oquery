Entity: Employees
Projection:
  - Id | Id
  - ManagerId | ManagerId
  - <0> | Level
Filter: Id = <1>
ExtraRelations:
  - Alias: EmployeeTree
    Condition: ManagerId = EmployeeTree.Id
    JoinType: Inner
    RefContextId: context-0
Contexts:
  - Id: context-0
    Name: EmployeeTree
    Entity: Employees
    Projection:
      - Id | Id
      - ManagerId | ManagerId
      - Difference(EmployeeTree.Level, <-1>) | Level
