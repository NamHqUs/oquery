Entity: Visits
Projection:
  - Diagnosis.Name | Diagnosis
  - Diagnosis.Category | DiagnosisCategory
  - Location.City | ClinicCity
  - CountDistinct(Id) | VisitCount
  - CountDistinct(UserId) | UniquePatients
  - ROUND(AVG(Charge), <2>) | AverageCharge
  - ROUND(<100.0> * SUM(Coalesce(VisitLabs.AbnormalCount, <0>)) / NULLIF(SUM(Coalesce(VisitLabs.LabCount, <0>)), <0>), <2>) | AbnormalLabPercent
Filter: Status = <Completed>
Sorts: VisitCount DESC, AbnormalLabPercent DESC, Diagnosis.Name ASC, Location.City ASC
Page: 1
PageSize: 10
ExtraRelations:
  - Alias: VisitLabs
    Condition: Id = VisitLabs.VisitId
    JoinType: Left
    RefContextId: context-0
Contexts:
  - Id: context-0
    Name: VisitLabs
    Entity: LabResults
    Projection:
      - VisitId | VisitId
      - COUNT(Id) | LabCount
      - CountIf(IsAbnormal = <True>) | AbnormalCount
